<title>TrendBoard</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --border: #e3e5e8;
    --text: #222;
    --text-sub: #888;
    --accent: #3b82f6;
    --badge-bg: #eef2ff;
  }
  :root[data-theme="dark"] {
    --bg: #16181d;
    --card-bg: #1f2228;
    --border: #2c2f36;
    --text: #e6e6e6;
    --text-sub: #8a8f98;
    --accent: #6ea8fe;
    --badge-bg: #1d2740;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d;
      --card-bg: #1f2228;
      --border: #2c2f36;
      --text: #e6e6e6;
      --text-sub: #8a8f98;
      --accent: #6ea8fe;
      --badge-bg: #1d2740;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  }
  header {
    max-width: 1620px;
    margin: 0 auto 24px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 28px;
    letter-spacing: -0.5px;
    text-wrap: balance;
  }
  .updated {
    font-size: 12px;
    color: var(--text-sub);
  }
  .grid {
    max-width: 1620px;
    margin: 24px auto 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .card.dragging { opacity: 0.4; }
  .card.drag-over { border-color: var(--accent); }
  .card-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    background: color-mix(in srgb, var(--card-bg) 92%, var(--text));
    cursor: grab;
  }
  .card-header:active { cursor: grabbing; }
  .drag-handle {
    flex: 0 0 auto;
    color: var(--text-sub);
    font-size: 14px;
    letter-spacing: -1px;
    user-select: none;
  }
  .card-header .title {
    font-weight: 700;
    font-size: 15px;
  }
  .card-header .board {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-sub);
  }
  ol.post-list {
    list-style: none;
    margin: 0;
    padding: 6px 0;
  }
  ol.post-list li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 16px;
    border-bottom: 1px dashed var(--border);
  }
  ol.post-list li:last-child { border-bottom: none; }
  .rank {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--text-sub);
    font-weight: 700;
    width: 16px;
    font-variant-numeric: tabular-nums;
  }
  .post-title {
    flex: 1 1 auto;
    font-size: 14px;
    color: var(--text);
    text-decoration: none;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .post-title:hover { color: var(--accent); text-decoration: underline; }
  .post-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .comments {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--accent);
    background: var(--badge-bg);
    border-radius: 10px;
    padding: 1px 7px;
    font-weight: 600;
    min-width: 20px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .empty-note {
    padding: 24px 16px;
    color: var(--text-sub);
    font-size: 13px;
    text-align: center;
  }
  footer {
    max-width: 1620px;
    margin: 36px auto 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-sub);
  }
  footer a { color: var(--accent); }
</style>

  (function () {
    const STORAGE_KEY = 'communityViewerOrder';
    const grid = document.getElementById('grid');
    const updatedEl = document.getElementById('updatedAt');
    const resetLink = document.getElementById('resetOrder');

    if (typeof COMMUNITY_DATA === 'undefined' || !COMMUNITY_DATA.communities) {
      updatedEl.textContent = '데이터가 없습니다.';
      return;
    }

    updatedEl.textContent = '마지막 업데이트: ' + COMMUNITY_DATA.generatedAt + ' (매시간 자동 갱신)';

    function getSavedOrder() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const arr = raw ? JSON.parse(raw) : null;
        return Array.isArray(arr) ? arr : null;
      } catch (e) {
        return null;
      }
    }
    function saveOrder(names) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(names)); } catch (e) {}
    }
    function applyOrder(communities, order) {
      if (!order) return communities.slice();
      const byName = {};
      communities.forEach(function (c) { byName[c.name] = c; });
      const ordered = [];
      order.forEach(function (name) {
        if (byName[name]) { ordered.push(byName[name]); delete byName[name]; }
      });
      communities.forEach(function (c) { if (byName[c.name]) ordered.push(c); });
      return ordered;
    }

    let currentOrder = applyOrder(COMMUNITY_DATA.communities, getSavedOrder());
    let dragSrcIndex = null;

    resetLink.addEventListener('click', function (e) {
      e.preventDefault();
      localStorage.removeItem(STORAGE_KEY);
      currentOrder = COMMUNITY_DATA.communities.slice();
      render();
    });

    function render() {
      grid.innerHTML = '';
      currentOrder.forEach(function (community, index) {
        const card = document.createElement('div');
        card.className = 'card';
        card.draggable = true;

        card.addEventListener('dragstart', function (e) {
          dragSrcIndex = index;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(index));
        });
        card.addEventListener('dragend', function () {
          card.classList.remove('dragging');
        });
        card.addEventListener('dragover', function (e) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          card.classList.add('drag-over');
        });
        card.addEventListener('dragleave', function () {
          card.classList.remove('drag-over');
        });
        card.addEventListener('drop', function (e) {
          e.preventDefault();
          card.classList.remove('drag-over');
          if (dragSrcIndex === null || dragSrcIndex === index) return;
          const reordered = currentOrder.slice();
          const moved = reordered.splice(dragSrcIndex, 1)[0];
          reordered.splice(index, 0, moved);
          currentOrder = reordered;
          saveOrder(currentOrder.map(function (c) { return c.name; }));
          render();
        });

        const header = document.createElement('div');
        header.className = 'card-header';
        header.innerHTML =
          '<span class="drag-handle" aria-hidden="true">⠿</span>' +
          '<span class="title">' + escapeHtml(community.name) + '</span>' +
          '<span class="board">' + escapeHtml(community.board || '') + (community.stale ? ' · 캐시' : '') + '</span>';
        card.appendChild(header);

        if (!community.posts || community.posts.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-note';
          empty.textContent = community.error
            ? '불러오지 못했습니다 (' + community.error + ')'
            : '표시할 게시글이 없습니다.';
          card.appendChild(empty);
        } else {
          const list = document.createElement('ol');
          list.className = 'post-list';
          community.posts.forEach(function (post, idx) {
            const li = document.createElement('li');
            li.innerHTML =
              '<span class="rank">' + (idx + 1) + '</span>' +
              '<a class="post-title" href="' + escapeAttr(post.url) + '" target="_blank" rel="noopener noreferrer" title="' + escapeAttr(post.title) + '">' + escapeHtml(post.title) + '</a>' +
              '<span class="comments">' + post.comments + '</span>';
            list.appendChild(li);
          });
          card.appendChild(list);
        }

        grid.appendChild(card);
      });
    }

    render();

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/"/g, '&quot;');
    }
  })();
</script>
